spring.application.name=distributed-realtime-web-analytics-engine
spring.profiles.default=local
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/analytics}
spring.datasource.username=${DATABASE_USERNAME:analytics}
spring.datasource.password=${DATABASE_PASSWORD:analytics}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=${JPA_BATCH_SIZE:1000}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.compression.type=lz4
spring.kafka.consumer.group-id=analytics-processors
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.analytics.engine.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.analytics.engine.dto.WebEvent
spring.kafka.listener.type=batch
spring.kafka.listener.ack-mode=batch
spring.kafka.listener.concurrency=${KAFKA_CONSUMER_CONCURRENCY:3}
spring.kafka.listener.poll-timeout=1s